# Golden placement list for P6b (test/rivernet-golden.yaml): hand-checked expectations, one per station.
#   station          registry station id
#   river            expected river id, or null (not placed on a river)
#   rule             override | name | official_km | canal | unsnapped (SNAP_RULES in packages/contracts/src/rivernet.ts)
#   km_official      exact expected official km (DE-1 row, or the RWS rkm of snap-overrides.yaml), or null
#   nl_entry_node    expected entry id of rivers.yaml (nl_entry.id): the nearest entry downstream (positive km_to_nl_entry),
#                    else upstream (negative, the station lies inside NL below it), else null (no path to an entry)
#   reason           the evidence: catalogue row, registry water_name, override
# nl_entry_node was derived on the committed fixture (tools/geo/fixtures, OSM 2026-10-01) with the Scheldt join of
# registry/rivers.yaml, by a longest-distance search over the graph edges from the nearest edge of the station's river;
# stations on a river with no downstream or upstream entry (the Lys, which stops at Gent) are null.
