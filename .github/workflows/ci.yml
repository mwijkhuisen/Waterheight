name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # The integration tests need TimescaleDB; they skip themselves without a
      # database, which would make a green build meaningless here.
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Build the map client
        run: npm run build:web

      - name: Test
        run: npm test

      - name: Verify the Docker image builds
        run: docker build -t rws:ci .
