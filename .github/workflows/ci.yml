# CI (issue #15; PHASES §5 P0; A§12.2 supply chain). The required check is the
# aggregate job `ci`. Hardening: top-level permissions {}, contents: read per
# job, harden-runner first, persist-credentials: false, no caches, no
# expressions inside run: (values come in through env:), actions pinned to
# full SHAs and downloaded binaries checked against pinned sha256 sums.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only; every commit on main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - name: pnpm policy is in effect (pnpm ignores a misspelt key)
        run: |
          test "$(pnpm config get minimumReleaseAge)" = 10080
          test "$(pnpm config get strictDepBuilds)" = true
          test "$(pnpm config get blockExoticSubdeps)" = true
          pnpm config get allowBuilds | grep -q '"msw": false'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Parse and normalise coverage of every adapter (at least 90% lines)
        run: pnpm test:coverage
      - run: pnpm -F web build
      - name: Server smoke test (GET /healthz, role exit codes)
        run: scripts/healthz-smoke.sh

  integration:
    name: integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # P9a's publisher tests (200-run properties, 20 SIGKILLed children) take the suite to about 12 minutes locally.
    # P16b: every test database syncs the larger NL-1 registry (2,974 series, 2,311 NL-4 rows). The whole suite took
    # 33.5 minutes on one runner (main, 39574e4; crash.int.test.ts alone 9.5), one file at a time because the roles are
    # cluster-wide. Three runners, each with its own PostgreSQL, take a third of the files each (Vitest's --shard splits
    # by a hash of the path, not by duration: shards 1, 2 and 3 about 12, 16 and 7 minutes from the per-file times of
    # that run; crash.int.test.ts is in shard 2).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          # Throwaway CI-only credential for an ephemeral service container.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
      SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration --shard="$SHARD"

  dbmate:
    name: dbmate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
      DBMATE_VERSION: v2.36.0
      DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dbmate (pinned, sha256-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/$DBMATE_VERSION/dbmate-linux-amd64"
          echo "$DBMATE_SHA256  $RUNNER_TEMP/bin/dbmate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: dbmate up/down/up on a fixture migration (outside db/migrations)
        run: scripts/dbmate-roundtrip.sh
      - name: A broken migration fails the round trip
        run: |
          if scripts/dbmate-roundtrip.sh scripts/fixtures/dbmate-broken; then
            echo "the round trip passed on a migration that cannot apply" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: db/migrations as rws_migrator (migrate, roll back, migrate); schema.sql, views and Kysely types are current
        env:
          # pg_dump must match the server's major version: the one inside the service container does.
          DB_CHECK_PG_DUMP: docker exec -i ${{ job.services.postgres.id }} pg_dump
        run: scripts/db-check.sh

  bench:
    name: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Q1 and the API (/snapshot cold/warm, /series 14 d raw) on 3,000 series × 60 days, as rws_api, and the publisher (budgets B1 to B4) (hard gate)
        run: node scripts/bench-q1.ts --series 3000

  # Owner decisions 2026-10-23 ("gate 3,000, report 4,000", KG-463; after the round-1 review the Q1 median is reported too): the correctness checks and B1–B4 are asserted, the Q1, tide and API timing limits are reported.
  bench-4000:
    name: bench-4000
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: 'Q1 and the API and the publisher on 4,000 series × 60 days: the correctness checks and B1–B4 asserted, the Q1, tide and API timing limits reported (owner, P20a)'
        run: node scripts/bench-q1.ts --series 4000 --report-timings

  # Its own job (P8a, C8): the seed is 25 M forecast values, and an aggregate that did not need it would gate nothing.
  bench-q2:
    name: bench-q2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Q2 "latest forecast run as of T" on 296 series × 60 days at twice the volume (about 212k runs, 25 M values), as rws_api
        run: node scripts/bench-q2.ts

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned, sha256-checked)
        run: |
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
      - name: shellcheck every shell script (deploy/bin has no extensions)
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'deploy/bin/*')
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" "${files[@]}"

  fresh-start:
    name: fresh-start
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The guard needs the whole history and the legacy-v0 tag.
          fetch-depth: 0
          fetch-tags: true
      - run: scripts/verify-fresh-start.sh
      - name: The legacy-only list still matches legacy-v0's paths
        run: scripts/check-legacy-only.sh

  hook:
    name: hook
    runs-on: ubuntu-24.04
    # The install, pnpm check and one integration file that builds a database through the hook's cluster (migrations,
    # every role and view: proof of its PostgreSQL and DATABASE_URL). The whole suite runs in the integration job; running
    # it here as well took 27 of this job's 28 minutes.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLAUDE_CODE_REMOTE: 'true'
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SessionStart hook, first run (installs)
        run: |
          export CLAUDE_ENV_FILE="$RUNNER_TEMP/claude.env" CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE"
          .claude/hooks/session-start.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/hook-1.log"
      - name: SessionStart hook, second run (must change nothing)
        run: |
          export CLAUDE_ENV_FILE="$RUNNER_TEMP/claude.env" CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE"
          .claude/hooks/session-start.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/hook-2.log"
          if grep -E '^(session-start: (install|creat|start|writ|reload)|install-pnpm: installed)' "$RUNNER_TEMP/hook-2.log"; then
            echo "the second run changed something" >&2
            exit 1
          fi
          grep -c . "$CLAUDE_ENV_FILE"
      - name: pnpm check and an integration file in the hook's environment
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/claude.env"
          node --version
          pnpm --version
          pnpm check
          pnpm test:integration apps/server/test/db/audience.int.test.ts

  # #217: the offline tests of the host scripts, a job of their own (163–220 s of the deploy job, which they need nothing
  # of). Docker, nft and systemctl are stubs in them; caddy-edge.test.sh runs the web image's pinned Caddy through the
  # runner's Docker without a network.
  deploy-host:
    name: deploy-host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host tools the tests need (Ubuntu's signed repository)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables zstd >/dev/null
      - name: Offline tests of the host scripts (rws-update, rws-deploy, backups, drill, tick)
        run: |
          for t in deploy/tests/*.test.sh; do echo "== $t"; "$t"; done

  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # P9a: run.sh drives the degraded spec in this image (the same value as the e2e job's; test/e2e-pins.test.ts).
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # run.sh installs both again with Docker, but flushes the runner's nft ruleset before that.
      - name: Host tools run.sh needs from the start (Ubuntu's signed repository)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables zstd >/dev/null
      - name: systemd-analyze verify on the units (scripts at their ExecStart paths)
        run: |
          for f in deploy/bin/rws-*; do [[ $f == *.sh ]] || sudo ln -sfn "$PWD/$f" "/usr/local/bin/${f##*/}"; done
          systemd-analyze verify --man=no --recursive-errors=no deploy/systemd/*
      - name: End to end on Docker 29.8.1 (nftables, Pebble ACME, MinIO Object Lock, restic, watchdog, publishers, owner site, degraded)
        run: sudo --preserve-env=PLAYWRIGHT_IMAGE deploy/tests/e2e/run.sh
      # P12a (criterion 9 in CI): docker inspect of every service and job of the running stack; the CI stand-ins are the
      # only exemptions (deploy/tests/hardening.sh --ci).
      - name: Container hardening audit (deploy/tests/hardening.sh --ci)
        run: sudo deploy/tests/hardening.sh --ci
      - name: scripts/verify-prod.ts against the running stack
        run: |
          # The profile of the phase the stack runs in: run.sh read it from the merged compose file (the default of
          # deploy/compose.yaml), tested both phases and put it back (P12b, review CR-4), so the launch flip changes
          # only that default and DEFAULT_PROFILE.
          phase=$(cat /ci/site-phase)
          [[ $phase == prelaunch || $phase == launch ]] || { echo "verify-prod: no site phase from run.sh ($phase)" >&2; exit 1; }
          node scripts/verify-prod.ts rivierstanden.example --resolve 203.0.114.10 --ca /ci/pki/pebble-root.pem --profile "$phase" \
            | tee "$RUNNER_TEMP/verify-prod.txt" || true
          # The allow-list of checks that need live data and the checks that must PASS: one file, shared with run.sh.
          deploy/tests/e2e/verify-gate.sh "$RUNNER_TEMP/verify-prod.txt"
      # #109: the same stack switched to RWS_EDGE=tunnel (compose.tunnel.yaml, cloudflared's service with the server
      # image idling in its place), proved from cloudflared's address, then audited again in that mode.
      - name: The tunnel edge (deploy/tests/e2e/tunnel.sh), then hardening.sh --ci in tunnel mode
        run: |
          sudo deploy/tests/e2e/tunnel.sh
          sudo deploy/tests/hardening.sh --ci

  # P3 (issue #18): the map spike under the exact production headers, served by
  # the real Caddy image and deploy/web/site.caddy over HTTPS (Caddy's local
  # CA), tested by Playwright 1.63.0 in its digest-pinned image (browsers and
  # their system libraries baked in; nothing downloaded at run time).
  # P4b (issue #19): the real pages too, with Caddy proxying /api/v1/ to the e2e
  # api (apps/server/test/e2e/api.ts: a seeded throw-away database on the
  # service container, the real routes on a fixed clock) on the runner.
  # One leg per browser engine: the 838 tests were about 65 test-minutes, 34 minutes on one runner's two workers (main,
  # 39574e4), which software WebGL keeps CPU-bound. #217: a fourth leg, owner-perf, takes the owner projects of Chromium
  # and WebKit and the CVD and screens pictures, then Lighthouse and fps (`alone`: after the rest of the leg, one test at
  # a time, so that nothing else is on the CPU). Every leg sets up the same api and Caddies; the api's seed (about 3
  # minutes) runs while the e2e build, the tiles and the image pulls do. test/e2e-pins.test.ts checks that every
  # Playwright project is in exactly one leg, and that Lighthouse and fps run alone.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: chromium no-webgl2 visual
            artifact: e2e-test-results-chromium
          - browser: firefox
            projects: firefox owner-firefox
            artifact: e2e-test-results-firefox
          - browser: webkit
            projects: webkit
            artifact: e2e-test-results-webkit
          # The CVD, screens, Lighthouse and fps output keeps the artifact name it always had.
          - browser: owner-perf
            projects: owner-chromium owner-webkit cvd
            alone: lighthouse fps
            artifact: e2e-test-results
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rws
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CADDY_IMAGE: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rws?sslmode=disable
      E2E_PROJECTS: ${{ matrix.projects }}
      E2E_ALONE: ${{ matrix.alone }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Start the e2e api on the runner (seeded throw-away database, fixed clock 2026-10-26T12:00Z) and its static files
        env:
          # P10a (C4): the docker0 gateway, which `--add-host=api:host-gateway` resolves to; the owner api (a second
          # listener of the same process) is on the runner's primary address, which the owner Caddy reaches as api-owner.
          HOST: 172.17.0.1
          PORT: '8080'
          # P9a: the api's startup runs one full publisher cycle into this directory; Caddy mounts its v1/.
          E2E_PUBLISH_DIR: ${{ runner.temp }}/publish
          # P10a: the owner tree (synthetic owner rows) of the same startup; the owner Caddy mounts its v1/.
          E2E_OWNER_PUBLISH_DIR: ${{ runner.temp }}/owner-publish
        run: |
          E2E_OWNER_API_HOST=$(hostname -I | cut -d' ' -f1)
          export E2E_OWNER_API_HOST
          # #217: it seeds while the next step builds. A server is never waited for: the steps below check its PID
          # (`kill -0`), and the runner stops it with the job's other orphan processes.
          node apps/server/test/e2e/api.ts >"$RUNNER_TEMP/e2e-api.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/e2e-api.pid"
      - name: While it seeds, the e2e build (the production pages plus /_spike/ and /en/_spike/), the tiles and the two images
        run: |
          set -euo pipefail
          docker pull -q "$CADDY_IMAGE" >"$RUNNER_TEMP/pull-caddy.log" 2>&1 &
          caddy_pull=$!
          docker pull -q "$PLAYWRIGHT_IMAGE" >"$RUNNER_TEMP/pull-playwright.log" 2>&1 &
          playwright_pull=$!
          pnpm -F web build:e2e
          node apps/web/e2e/prepare-tiles.ts "$RUNNER_TEMP/tiles" "$RUNNER_TEMP/rivers" "$RUNNER_TEMP/downloads"
          if ! wait "$caddy_pull"; then cat "$RUNNER_TEMP/pull-caddy.log"; exit 1; fi
          if ! wait "$playwright_pull"; then cat "$RUNNER_TEMP/pull-playwright.log"; exit 1; fi
      - name: The e2e api is up
        run: |
          pid=$(cat "$RUNNER_TEMP/e2e-api.pid")
          # P11b: the seed and the public publish of nine settled days take about 3 minutes (174 s on a dev box).
          for _ in $(seq 1 300); do
            if grep -q '^e2e api listening' "$RUNNER_TEMP/e2e-api.log"; then exit 0; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/e2e-api.log"
          exit 1
      # P12b (A4, A15): the site in both phases. e2e-caddy is prelaunch (the default of site.caddy: noindex, no robots.txt
      # or sitemap) on 443, e2e-caddy-launch is RWS_SITE_PHASE=launch on 8444 (launch.spec.ts; its RWS_DOMAIN carries
      # the port, so that the absolute URLs of robots.txt, the sitemap and the Open Graph tags are the origin the browser
      # uses). Both read the phase snippets next to site.caddy.
      - name: Serve it through the real Caddy image and site.caddy, in both phases (HTTPS on localhost:443 and :8444; api:8080 is the runner)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ops"
          serve() { # name port RWS_DOMAIN phase
            docker run -d --name "$1" -p "127.0.0.1:$2:$2" --add-host=api:host-gateway \
              -e RWS_DOMAIN="$3" -e RWS_SITE_PHASE="$4" -e RWS_CONTACT_EMAIL=ci@rivierstanden.example \
              -e RWS_OPERATOR_NAME="E2E Operator" -e RWS_CDN_NAME= \
              -v "$PWD/apps/web/e2e/Caddyfile.e2e:/etc/caddy/Caddyfile:ro" \
              -v "$PWD/deploy/web/site.caddy:/etc/caddy/site.caddy:ro" \
              -v "$PWD/deploy/web/phase-prelaunch.caddy:/etc/caddy/phase-prelaunch.caddy:ro" \
              -v "$PWD/deploy/web/phase-launch.caddy:/etc/caddy/phase-launch.caddy:ro" \
              -v "$PWD/deploy/web/edge-https.caddy:/etc/caddy/edge-https.caddy:ro" \
              -v "$PWD/apps/web/dist-e2e:/srv/www:ro" \
              -v "$RUNNER_TEMP/tiles:/srv/rws/tiles:ro" \
              -v "$RUNNER_TEMP/rivers:/srv/rws/public/data/v1/rivers:ro" \
              -v "$RUNNER_TEMP/downloads:/srv/rws/public/downloads:ro" \
              -v "$RUNNER_TEMP/ops:/srv/rws/public/ops:ro" \
              -v "$RUNNER_TEMP/publish/v1:/srv/rws/public/www/v1:ro" \
              "$CADDY_IMAGE" caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          serve e2e-caddy 443 localhost prelaunch
          serve e2e-caddy-launch 8444 localhost:8444 launch
          for url in https://localhost/healthz https://localhost:8444/healthz; do
            up=false
            for _ in $(seq 1 30); do
              if curl -fsSk -o /dev/null "$url"; then up=true; break; fi
              sleep 1
            done
            if [ "$up" != true ]; then
              docker logs e2e-caddy
              docker logs e2e-caddy-launch
              exit 1
            fi
          done
      # P10a: the production owner site (deploy/web/owner.caddy: basic_auth, the owner headers, the owner tree, the
      # tiles and the river files) in a second real Caddy container. The password is made here, hashed in the Caddy
      # image and never printed or written to the repository; the secret file is the one-line `owner <hash>` that
      # production mounts. api-owner is the owner listener of the e2e api on the runner (the owner Caddy has no
      # public network name for it).
      - name: Serve the owner site through the real Caddy image and owner.caddy (https://owner.localhost:8443)
        run: |
          set -euo pipefail
          OWNER_PW=$(openssl rand -hex 16)
          echo "::add-mask::$OWNER_PW"
          hash=$(docker run --rm "$CADDY_IMAGE" caddy hash-password --plaintext "$OWNER_PW")
          mkdir -p "$RUNNER_TEMP/secrets"
          printf 'owner %s\n' "$hash" >"$RUNNER_TEMP/secrets/owner_basic_auth"
          chmod 0444 "$RUNNER_TEMP/secrets/owner_basic_auth"
          echo "E2E_OWNER_PW=$OWNER_PW" >>"$GITHUB_ENV"
          docker run -d --name e2e-caddy-owner -p 127.0.0.1:8443:8443 \
            --add-host "api-owner:$(hostname -I | cut -d' ' -f1)" \
            -e RWS_DOMAIN=localhost -e RWS_CONTACT_EMAIL=ci@rivierstanden.example \
            -e RWS_OPERATOR_NAME="E2E Operator" -e RWS_CDN_NAME= \
            -v "$PWD/apps/web/e2e/Caddyfile.owner.e2e:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/web/owner.caddy:/etc/caddy/owner.caddy:ro" \
            -v "$RUNNER_TEMP/secrets/owner_basic_auth:/run/secrets/owner_basic_auth:ro" \
            -v "$PWD/apps/web/dist-e2e:/srv/www:ro" \
            -v "$RUNNER_TEMP/owner-publish/v1:/srv/rws/owner/www/v1:ro" \
            -v "$RUNNER_TEMP/tiles:/srv/rws/tiles:ro" \
            -v "$RUNNER_TEMP/rivers:/srv/rws/public/data/v1/rivers:ro" \
            "$CADDY_IMAGE" caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          for _ in $(seq 1 30); do
            # 401 is the answer to a request without credentials: the site is up and gated.
            if [ "$(curl -sk -o /dev/null -w '%{http_code}' --resolve owner.localhost:8443:127.0.0.1 https://owner.localhost:8443/)" = 401 ]; then exit 0; fi
            sleep 1
          done
          docker logs e2e-caddy-owner
          exit 1
      # Headless Firefox finds no GL driver without an X display (FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS):
      # the image's own Xvfb gives it one, with Mesa's software renderer (ADR-0016). --init: xvfb-run waits for
      # Xvfb's ready signal, which a PID 1 never gets, so without an init process it hangs silently.
      - name: Playwright (this leg's projects, then the ones that run alone) in the pinned Playwright image
        # The slowest leg's step took 1,136 s before #217 (run 40115392921; the whole suite took 34 minutes on one runner).
        timeout-minutes: 30
        run: |
          kill -0 "$(cat "$RUNNER_TEMP/e2e-api.pid")" || { echo "the e2e api is gone" >&2; tail -n 100 "$RUNNER_TEMP/e2e-api.log"; exit 1; }
          # P10a: the owner projects reach the owner Caddy (WebKit does not resolve *.localhost itself).
          # The password reaches the container by name only (-e E2E_OWNER_PW takes it from the step's environment).
          pw() {
            docker run --rm --init --network host --ipc=host \
              --add-host owner.localhost:127.0.0.1 \
              -e CI=true -e E2E_BASE_URL=https://localhost -e E2E_BASE_URL_LAUNCH=https://localhost:8444 \
              -e E2E_OWNER_URL=https://owner.localhost:8443 -e E2E_OWNER_PW \
              -v "$PWD:/work" -w /work/apps/web \
              "$PLAYWRIGHT_IMAGE" xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
              node_modules/.bin/playwright test -c e2e/playwright.config.ts "$@"
          }
          args=()
          for p in $E2E_PROJECTS; do args+=(--project="$p"); done
          rc=0
          pw "${args[@]}" || rc=$?
          if [ -n "$E2E_ALONE" ]; then
            # #217: Lighthouse and fps after the rest of the leg, one test at a time (--workers=1), without their
            # dependencies (LIGHTHOUSE_AFTER only orders them after the other Chromium projects, which other legs run).
            # Their own output folder: a run empties its output folder first, and test-results/ holds the CVD and
            # screens pictures of the run above.
            alone=()
            for p in $E2E_ALONE; do alone+=(--project="$p"); done
            pw "${alone[@]}" --no-deps --workers=1 --output=test-results/alone || rc=$?
          fi
          exit "$rc"
      # CVD screenshots, Lighthouse reports and each failed test's context (the owner-perf leg keeps the old name).
      - name: Upload the Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # P11b (issue #26 B3): the baselines of the visual project. The first run has none: Playwright writes each one and
      # fails, so this step runs; the owner views every PNG before committing it (never a locally generated one).
      - name: Upload the visual baselines
        if: failure() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-visual-baselines
          path: apps/web/e2e/visual/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Caddy's log, the e2e api's log and Playwright's failure context
        if: failure()
        run: |
          docker logs e2e-caddy 2>&1 | tail -n 100
          docker logs e2e-caddy-launch 2>&1 | tail -n 100
          docker logs e2e-caddy-owner 2>&1 | tail -n 100
          tail -n 100 "$RUNNER_TEMP/e2e-api.log"
          # Each failed test's page snapshot (error-context.md): what the browser showed, e.g. its own error page.
          find apps/web/test-results -name error-context.md -print -exec head -n 80 {} \; 2>/dev/null | head -n 400

  ci:
    name: ci
    if: always()
    needs: [check, integration, dbmate, bench, bench-4000, bench-q2, shellcheck, fresh-start, hook, deploy-host, deploy, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
