# Security checks (issue #15; A§12.2). The required check is the aggregate job
# `security`. Same hardening as ci.yml; only the CodeQL job may write security
# events (the repository is public, decision D7).
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  # Cancel superseded runs on PRs only; every commit on main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: v1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned, sha256-checked)
        run: |
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      - name: zizmor, medium and above (online audits read the pinned commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor" --version
          "$RUNNER_TEMP/zizmor" --min-severity medium --format plain .github/

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, sha256-checked)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: gitleaks over the full history (values redacted)
        run: |
          gitleaks version
          # -m: also scan what merge commits introduce (conflict resolutions).
          gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts=-m .
      - name: A planted fake key still fails the scan
        run: scripts/gitleaks-planted.sh

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SHA pins, top-level permissions {}, no forbidden triggers or caches
        run: scripts/check-workflows.sh

  codeql:
    name: codeql
    # CodeQL is free for public repositories only (decision D7).
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload CodeQL results (SARIF) to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # No caches in CI (a PR run must never seed a main run).
          trap-caching: false
          dependency-caching: false
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # P12a: the weekly rescan of what is deployed. The PR gate (release.yml build-pr) sees only the
  # day a dependency was pinned; a new advisory against an old image shows up here. It scans the
  # images of the latest release manifest (public GHCR packages, pulled anonymously, by digest),
  # not a fresh build, so it costs no build and is exactly what the VPS runs. It is not part of
  # the aggregate `security` check (a new advisory must never block an unrelated PR); a red run
  # is the signal: bump the pin, or the owner decides (docs/risk-register.md). No ignore entries.
  grype-weekly:
    name: grype-weekly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SYFT_VERSION: 1.52.0
      SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
      GRYPE_VERSION: 0.119.0
      GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Install Syft and Grype (pinned, sha256-checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for t in syft grype; do
            case $t in
              syft) v=$SYFT_VERSION sha=$SYFT_SHA256 repo=anchore/syft ;;
              grype) v=$GRYPE_VERSION sha=$GRYPE_SHA256 repo=anchore/grype ;;
            esac
            tarball="${t}_${v}_linux_amd64.tar.gz"
            curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/$repo/releases/download/v$v/$tarball"
            echo "$sha  $RUNNER_TEMP/$tarball" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" "$t"
          done
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Scan the three images of the latest release (fixable High or Critical fails)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          syft --version
          grype --version
          mkdir "$RUNNER_TEMP/rel"
          gh release download --repo "$GH_REPO" --pattern release-manifest.json --dir "$RUNNER_TEMP/rel"
          fail=0
          for name in server web backup; do
            ref=$(jq -r --arg n "$name" '.images[$n]' "$RUNNER_TEMP/rel/release-manifest.json")
            [[ $ref =~ ^ghcr\.io/mwijkhuisen/waterheight/$name@sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected image reference for $name" >&2; exit 1; }
            syft "registry:$ref" -o "syft-json=$RUNNER_TEMP/sbom-$name.json" -q
            echo "$name: $(jq '.artifacts | length' "$RUNNER_TEMP/sbom-$name.json") packages in the SBOM"
            grype "sbom:$RUNNER_TEMP/sbom-$name.json" --only-fixed --fail-on high || fail=1
          done
          exit "$fail"

  security:
    name: security
    if: always()
    needs: [zizmor, gitleaks, workflow-lint, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Every job succeeded (CodeQL may be skipped only on a private repository)
        env:
          NEEDS: ${{ toJSON(needs) }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg vis "$VISIBILITY" '
            to_entries | all(.value.result == "success"
              or (.key == "codeql" and .value.result == "skipped" and $vis != "public"))' >/dev/null
