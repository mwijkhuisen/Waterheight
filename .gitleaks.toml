# gitleaks 8.30.1: the default rules plus a narrow allowlist of the public
# false positives in the verbatim planning bundle (issue #15; listed in
# docs/risk-register.md). Each entry needs the exact secret AND the exact file
# AND the rule to match: never a whole path, a disabled rule or a commit
# fingerprint (those break on squash or rebase merges). A planted key still
# fails the scan: scripts/gitleaks-planted.sh.
[extend]
useDefault = true

[[allowlists]]
description = "Protomaps build file name quoted as format evidence (catalogue §5.1; research/map-rivers.md), not a key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^20260923\.pmtiles$''']
paths = ['''^docs/sources/SOURCE-CATALOGUE\.md$''', '''^docs/sources/research/map-rivers\.md$''']

[[allowlists]]
description = "Public sha256 of the apt.postgresql.org signing-key file (ACCC4CF8.asc) pinned in the SessionStart hook, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76$''']
paths = ['''^\.claude/hooks/session-start\.sh$''']

[[allowlists]]
description = "Prose in the secure-ops proposal ('temporal-key edge cases, forecast/observation joins'), not a key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^forecast/observation$''']
paths = ['''^docs/plan/proposals/secure-ops\.md$''']

[[allowlists]]
description = "Public sha256 of Docker's apt signing-key file (download.docker.com/linux/debian/gpg) pinned in bootstrap.sh, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570$''']
paths = ['''^deploy/host/bootstrap\.sh$''']

[[allowlists]]
description = "Dummy healthchecks ping key of the offline host-script tests (stubbed curl, never sent), not a key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^testPingKey_0123456789ab$''']
paths = ['''^deploy/tests/rws-update\.test\.sh$''', '''^deploy/tests/backup\.test\.sh$''']

[[allowlists]]
description = "Names of two NL-1 fixture files, passed right after the capture spec id 'nl-1-obs-key' in the loader test, not keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^nl-1-obs-key-eijsden-grens-h$''', '''^nl-1-obs-split\.synthetic$''']
paths = ['''^apps/server/test/load/nl\.int\.test\.ts$''']
