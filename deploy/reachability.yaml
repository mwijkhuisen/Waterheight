# Reachability targets of deploy/bin/rws-reachability (issue #16 P1b; A§12.2;
# catalogue §10 R7). The owner runs it once on the VPS, as ops, over IPv4 and
# IPv6 (docs/runbooks/owner-checks.md).
#
# A target passes only when the body carries its signature: `sig` is an
# extended regex over the first 64 KB, or `magic:<hex>` for the first bytes. A
# status alone never passes, so a 200 "blocked" PNG, a Cloudflare challenge, an
# Azure APIM error or Hub'Eau's "usage abusif" page fail.
#
# `required: true` marks the first-release endpoints (every host of
# registry/capture.yaml, owner hosts included) and what the deploy itself needs;
# a failure there exits non-zero and belongs in docs/risk-register.md with its
# fallback. `required: false` marks the sandbox failures to re-test (R7) and the
# later §1a endpoints that answer without a key (BE-1, BE-2, DE-10, DE-12,
# NL-5), which are only reported; their signatures are data (a JSON key, a
# station code, a file or field name from catalogue §1a/§2), never a generic
# word a block or error page could carry. `fixture` names the committed payload
# the signature is tested against (test/reachability.test.ts). One request per
# target and family, never a key: NL-1 is sent without X-API-KEY, and DE-9
# (NLWKN, a key in every URL) is left out.
#
# JSON syntax (valid YAML), so the host reads it with jq.
