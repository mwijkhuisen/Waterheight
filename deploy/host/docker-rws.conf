# rws host (issue #16 P1b), installed as /etc/systemd/system/docker.service.d/10-rws.conf:
# the firewall table exists before Docker publishes any port, and Docker does
# not start without it (Requires=, so a firewall that fails to load fails closed).
[Unit]
Requires=rws-firewall.service
After=rws-firewall.service
