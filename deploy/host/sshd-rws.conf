# rws host SSH (A§12.2; issue #16 P1b), installed as /etc/ssh/sshd_config.d/10-rws.conf.
# The first value of a keyword wins, so this file beats later drop-ins
# (cloud-init's 50-cloud-init.conf included). Keys only; the provider console is
# the break-glass path (docs/runbooks/lost-ssh.md).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers ops
X11Forwarding no
MaxAuthTries 3
