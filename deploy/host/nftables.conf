#!/usr/sbin/nft -f
# Host firewall (A§11.1, A§12.2; issue #16 P1b), loaded by rws-firewall.service
# before Docker starts. It manages only its own table and never flushes the
# ruleset: Docker 29.8.1 keeps its rules in tables of its own (the iptables-nft
# backend), and Debian's nftables.service, whose ExecStop is `nft flush
# ruleset`, is masked by bootstrap.sh.
#
# Published container ports never reach INPUT: Docker DNATs them in nat
# PREROUTING and accepts them in filter FORWARD (DOCKER-FORWARD). The forward
# chain below hooks the same point at a lower priority number, and a drop in
# any base chain is final, so these rules hold whatever Docker accepts, with
# the iptables backend or the (experimental) nftables one.

table inet rws
delete table inet rws

table inet rws {
	# The host's resolvers, filled by rws-resolvers from resolv.conf.
	set resolvers4 {
		type ipv4_addr
	}
	set resolvers6 {
		type ipv6_addr
	}
	# The backup bucket's addresses, filled by rws-backup before each run.
	set backup4 {
		type ipv4_addr
	}
	set backup6 {
		type ipv6_addr
	}
	# New SSH connections per source: an IPv4 address, or an IPv6 /64 (one
	# subscriber's prefix, so rotating addresses inside it do not help).
	set ssh4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 1m
	}
	set ssh6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 1m
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# IPv6 does not work without neighbour discovery, on the container bridges too:
		# a container resolves its gateway (the host's bridge address) this way.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept
		# Otherwise containers never talk to the host itself (its sshd included).
		iifname { "rws-*", "docker0" } drop
		ip protocol icmp icmp type echo-request limit rate 10/second accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert } accept
		icmpv6 type echo-request limit rate 10/second accept
		# DHCP and DHCPv6 replies.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
		# SSH (keys only, AllowUsers ops): at most 6 new connections a minute per IPv4 address or IPv6 /64,
		# and 60 a minute from everyone together: an update of a full meter set does not match, so a
		# flood from many sources would pass the per-source meters (during one, the owner may wait too).
		tcp dport 22 ct state new add @ssh4 { ip saddr limit rate over 6/minute burst 6 packets } drop
		tcp dport 22 ct state new add @ssh6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate over 6/minute burst 6 packets } drop
		tcp dport 22 ct state new limit rate over 60/minute burst 30 packets drop
		tcp dport 22 accept
		# The public site; docker-proxy paths arrive here, DNAT paths in forward.
		tcp dport { 80, 443 } accept
		udp dport 443 accept
	}

	chain forward {
		type filter hook forward priority filter - 5; policy accept;
		ct state established,related accept
		ct state invalid drop
		iifname { "rws-*", "docker0" } jump from_containers
		oifname { "rws-*", "docker0" } jump to_containers
	}

	# From outside into a container: only the DNATed public site (80/tcp,
	# 443/tcp, 443/udp). Container to container across bridges (the watchdog's
	# probe of the public address) is left to Docker.
	chain to_containers {
		iifname { "rws-*", "docker0" } return
		ct status dnat tcp dport { 80, 443 } accept
		ct status dnat udp dport 443 accept
		drop
	}

	# From a container to the outside: DNS to the host's resolvers; TCP 443 from
	# the egress and public networks (capture, watchdog, ACME); TCP 443 to the
	# bucket only from the backup network. Nothing else, IPv4 or IPv6.
	chain from_containers {
		oifname { "rws-*", "docker0" } return
		meta l4proto { tcp, udp } th dport 53 ip daddr @resolvers4 accept
		meta l4proto { tcp, udp } th dport 53 ip6 daddr @resolvers6 accept
		iifname { "rws-egress", "rws-public" } tcp dport 443 accept
		iifname "rws-backup" tcp dport 443 ip daddr @backup4 accept
		iifname "rws-backup" tcp dport 443 ip6 daddr @backup6 accept
		drop
	}
}
