// rws host (issue #16 P1b), installed as /etc/apt/apt.conf.d/52rws-unattended.
// Debian's security updates daily (50unattended-upgrades); when one needs a
// reboot, reboot at 03:40 UTC (owner decision, 2026-09-29): capture is back
// within minutes and a missed tick runs once on start.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "03:40";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
