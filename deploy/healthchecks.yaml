# healthchecks.io checks (issue #16 "P1a ↔ P1b contract"; A§11.3): 18 of the 20
# free checks (P2a adds `load`, which the watchdog pings from /api/v1/health; P9a
# adds `publisher`, which the watchdog pings from /data/v1/meta.json, and
# `owner-publisher`, which rws-tick pings from the mtime of the owner meta.json).
# timeout = the check's cadence (a capture group's shortest cadence), grace =
# 2 × timeout, so an alert fires after 3 × cadence without a ping. The check
# name is the slug and carries no source ID. Synced by deploy/bin/rws-hc-sync;
# test/healthchecks.test.ts ties the cap-* timeouts to registry/capture.yaml.
# JSON syntax (valid YAML), so the host reads it with jq.
{
  "checks": [
    { "slug": "cap-nl", "timeout": 600, "grace": 1200 },
    { "slug": "cap-de-fed", "timeout": 900, "grace": 1800 },
