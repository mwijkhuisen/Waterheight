# pg_hba.conf of the db service (A§12.2): one rule per role and network, first
# match wins. "samenet" is the internal Compose network "db" (the container has
# no other interface besides loopback); nothing is published. The superuser and
# the dump role exist only on the local socket inside the container.
# TYPE  DATABASE  USER           ADDRESS   METHOD
local   all       postgres                 peer
local   rws       rws_backup               peer map=rws_backup
host    rws       rws_migrator   samenet   scram-sha-256
host    rws       rws_load       samenet   scram-sha-256
host    rws       rws_publish    samenet   scram-sha-256
host    rws       rws_api        samenet   scram-sha-256
host    rws       rws_owner_api  samenet   scram-sha-256
local   all       all                      reject
host    all       all            all       reject
