# The production stack (A§11.1; issue #16 P1b and its P1a ↔ P1b contract).
#
# rws-deploy runs it only from a verified release bundle, as project "rws":
#   - images: digests from the signed release manifest (images.env);
#   - host settings: /etc/rws/rws.env (domain, contact, public addresses, bucket);
#   - secrets: files under /etc/rws/secrets, never environment variables. Compose
#     bind-mounts a file secret with its host owner and mode (uid/gid/mode are
#     ignored), so each file is root:<gid> 0440 and only its consumer is in
#     that group (docs/runbooks/bootstrap.md, "Secrets").
# The owner channel in P1 is only /srv/rws/owner/status, mounted into capture.
# No owner site, port or Caddy mount before P9 (WireGuard-only from P12a).
# The database (P2a): db publishes no port and sits only on the internal network
# "db"; rws-lib.sh starts it, sets the roles and passwords through its local
# socket and runs `migrate` before `up` starts load and api (deploy_release).
# Bind sources are absolute host paths, never paths inside a release directory.
name: rws

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-node-healthcheck: &node-healthcheck
  # The contract heartbeat: exit 0 iff /tmp/rws-heartbeat is < 120 s old. No shell in distroless.
  test: ["CMD", "/nodejs/bin/node", "/app/apps/server/dist/main.js", "healthcheck"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  caddy:
    <<: *hardening
    image: ${RWS_WEB_IMAGE:?}
    user: "65533:65533"
    # No capability: the image strips caddy's file capability, and a non-root
    # process binds 80/443 through this namespaced sysctl (it covers IPv6 too).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    # The only published ports, on the explicit public addresses, never a
    # wildcard (a wildcard would also claim the later WireGuard address).
    ports:
      - "${RWS_PUBLIC_IPV4:?}:80:80/tcp"
      - "${RWS_PUBLIC_IPV4:?}:443:443/tcp"
      - "${RWS_PUBLIC_IPV4:?}:443:443/udp"
      - "[${RWS_PUBLIC_IPV6:?}]:80:80/tcp"
      - "[${RWS_PUBLIC_IPV6:?}]:443:443/tcp"
      - "[${RWS_PUBLIC_IPV6:?}]:443:443/udp"
    environment:
      RWS_DOMAIN: ${RWS_DOMAIN:?}
      RWS_CONTACT_EMAIL: ${RWS_CONTACT_EMAIL:?}
    # Only directories no networked role writes: the root-owned status directory
    # (never capture's public/status, where a planted symlink would make Caddy
    # serve any file it can read) and the tiles directory, which only
    # basemap-promote writes (no network; it moves only checked regular files
    # into it, so there is no link for Caddy to follow; the networked `basemap`
    # job gets only its .staging subdirectory; T-WEB-1).
    volumes:
      - /srv/rws/public/ops:/srv/rws/public/ops:ro
      - /srv/rws/tiles:/srv/rws/tiles:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, edge]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  capture:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [capture]
    user: "65532:65532"
    group_add: ["61001", "61002"]
    environment:
      RWS_RAW_DIR: /data/raw
      RWS_STATUS_DIR: /data/status
      RWS_OWNER_STATUS_DIR: /data/owner-status
      RWS_DOMAIN: ${RWS_DOMAIN:?}
      RWS_CONTACT_EMAIL: ${RWS_CONTACT_EMAIL:?}
    secrets: [hc_ping_key, rws_x_api_key]
    volumes:
      - /srv/rws/raw:/data/raw
      - /srv/rws/public/status:/data/status
      - /srv/rws/owner/status:/data/owner-status
    networks: [egress]
    mem_limit: 384m
    cpus: 2.0
    pids_limit: 128
    healthcheck: *node-healthcheck

  watchdog:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [watchdog]
    user: "65532:65532"
    group_add: ["61001"]
    environment:
      RWS_DOMAIN: ${RWS_DOMAIN:?}
      RWS_CONTACT_EMAIL: ${RWS_CONTACT_EMAIL:?}
    secrets: [hc_ping_key]
    networks: [egress]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck: *node-healthcheck

  # A job, not a daemon: rws-backup and rws-restore-drill start it with
  # `compose run` (profile "jobs", so `up` never starts it and never restarts it).
  backup:
    <<: *hardening
    image: ${RWS_BACKUP_IMAGE:?}
    profiles: [jobs]
    restart: "no"
    user: "65532:65532"
    group_add: ["61003"]
    hostname: rws
    environment:
      RESTIC_REPOSITORY: ${RWS_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/s3_credentials
      AWS_DEFAULT_REGION: ${RWS_S3_REGION:-}
      RESTIC_CACHE_DIR: /cache/restic
    secrets: [restic_password, s3_credentials]
    volumes:
      - /srv/rws/raw:/data/raw:ro
      # The nightly dump (rws-backup writes it on the host from `exec db pg_dump`,
      # root:61003 0440): the backup job never joins the db network.
      - /srv/rws/backup/db:/data/db:ro
      - /srv/rws/backup/cache:/cache
      - /srv/rws/backup/drill:/restore
    networks: [backup]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      disable: true

  # The basemap refresh (P3, ADR-0016): two jobs, never daemons, that
  # rws-basemap-refresh runs one after the other with `compose run` (profile
  # "jobs"). The server image's `basemap` role; go-pmtiles 1.31.2 is in the image.
  # Why two services (T-WEB-1): Caddy serves /srv/rws/tiles, follows symlinks and
  # holds the TLS keys, and `basemap fetch` has the network and feeds on bytes
  # from a third party. So fetch writes only .staging, a subdirectory Caddy never
  # serves, and sees the served directory read-only; `basemap promote` has no
  # network at all, checks what fetch left (regular files, names, sizes, sha256,
  # PMTiles headers) and moves only those into the served directory, then writes
  # manifest.json. A compromised fetch can put anything in .staging, links
  # included, but nothing but checked regular files leaves it.
  # No secret: the project User-Agent only needs the domain and the contact.
  basemap:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [basemap, fetch]
    profiles: [jobs]
    restart: "no"
    user: "65532:65532"
    environment:
      RWS_DOMAIN: ${RWS_DOMAIN:?}
      RWS_CONTACT_EMAIL: ${RWS_CONTACT_EMAIL:?}
      # go-pmtiles' temporary files go to .staging: /tmp is 16 MB, the root read-only.
      TMPDIR: /staging
      GOMEMLIMIT: 400MiB
    volumes:
      - /srv/rws/tiles:/tiles:ro
      - /srv/rws/tiles/.staging:/staging
    networks: [egress]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      disable: true

  basemap-promote:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [basemap, promote]
    profiles: [jobs]
    restart: "no"
    user: "65532:65532"
    # No network at all: it never joins a network, so there is no namespace to
    # reach anything from.
    network_mode: none
    volumes:
      - /srv/rws/tiles:/tiles
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      disable: true

  # PostgreSQL 18 as uid 999 (the image's postgres user) on a read-only root:
  # the data in the named volume, the socket and /tmp on tmpfs. The superuser
  # and rws_backup log in only through the local socket (peer); every other
  # role only from the db network with scram-sha-256 (deploy/postgres/pg_hba.conf,
  # installed by bootstrap.sh to /etc/rws/postgres).
  db:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    user: "999:999"
    group_add: ["61004"]
    environment:
      POSTGRES_DB: rws
      # Read by initdb only; pg_hba.conf never lets the superuser in over TCP.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --encoding=UTF8 --auth-local=peer --auth-host=scram-sha-256
    # Memory for a 3 GB container on the 8 GB VPS: 40 connections (the role
    # limits add up to 33), 768 MB shared buffers, 16 MB per sort or hash.
    command:
      - postgres
      - -c
      - hba_file=/etc/rws-postgres/pg_hba.conf
      - -c
      - ident_file=/etc/rws-postgres/pg_ident.conf
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - max_connections=40
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      # 512 kB of LISTEN/NOTIFY queue instead of 8 GB on the data volume:
      # nothing of ours uses it, and a reader session could fill it.
      - -c
      - max_notify_queue_pages=64
    secrets: [db_postgres]
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0775
    shm_size: 256m
    volumes:
      # The PG18 image's VOLUME: PGDATA is /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - /etc/rws/postgres:/etc/rws-postgres:ro
    networks: [db]
    mem_limit: 3g
    cpus: 2.0
    # 40 backends, the parallel, autovacuum and I/O workers, and the exec'd
    # psql, pg_dump and pg_isready.
    pids_limit: 128
    stop_grace_period: 60s
    healthcheck:
      # PID 1 is postgres only once the image's entrypoint has finished its
      # first-run set-up; its temporary socket-only server must not count.
      test: ["CMD-SHELL", "grep -qx postgres /proc/1/comm && pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  # A job: rws-lib.sh (deploy_release) runs it with `compose run` after the
  # roles and passwords are set. dbmate 2.36.0 in the server image, as rws_migrator.
  migrate:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [migrate]
    profiles: [jobs]
    restart: "no"
    user: "65532:65532"
    group_add: ["61005"]
    environment:
      RWS_DB_HOST: db
      RWS_DB_PORT: "5432"
      RWS_DB_NAME: rws
    secrets: [db_rws_migrator]
    networks: [db]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      disable: true

  # Parses the raw archive into the database; the retention pruner (dry run
  # unless RWS_PRUNE_APPLY=1, which is never set here) needs raw read-write.
  load:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [load]
    user: "65532:65532"
    group_add: ["61006"]
    environment:
      RWS_RAW_DIR: /data/raw
      RWS_DB_HOST: db
      RWS_DB_PORT: "5432"
      RWS_DB_NAME: rws
    secrets: [db_rws_load]
    volumes:
      - /srv/rws/raw:/data/raw
    networks: [db]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    healthcheck: *node-healthcheck

  # The public API; Caddy proxies only /api/v1/health and /api/v1/health/sources.
  api:
    <<: *hardening
    image: ${RWS_SERVER_IMAGE:?}
    command: [api]
    user: "65532:65532"
    group_add: ["61008"]
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      RWS_DB_HOST: db
      RWS_DB_PORT: "5432"
      RWS_DB_NAME: rws
    secrets: [db_rws_api]
    networks: [edge, db]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck: *node-healthcheck

  # P9 adds publish (server image [publish], networks [db], /srv/rws/public rw,
  # role rws_publish, secret db_rws_publish, gid 61007) and the owner services
  # (role rws_owner_api, secret db_rws_owner_api, gid 61009).

networks:
  public:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: rws-public
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.30.10.0/24
        - subnet: fd7a:7773:10::/64
  edge:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: rws-edge
  db:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: rws-db
  # Capture and watchdog: tcp/443 and DNS to the host's resolvers only (nftables).
  egress:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: rws-egress
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.30.20.0/24
        - subnet: fd7a:7773:20::/64
  # Backup: tcp/443 to the bucket's addresses only (nftables sets filled by rws-backup).
  backup:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: rws-backup
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.30.30.0/24
        - subnet: fd7a:7773:30::/64

secrets:
  hc_ping_key:
    file: /etc/rws/secrets/hc_ping_key
  rws_x_api_key:
    file: /etc/rws/secrets/rws_x_api_key
  restic_password:
    file: /etc/rws/secrets/restic_password
  s3_credentials:
    file: /etc/rws/secrets/s3_credentials
  db_postgres:
    file: /etc/rws/secrets/db_postgres
  db_rws_migrator:
    file: /etc/rws/secrets/db_rws_migrator
  db_rws_load:
    file: /etc/rws/secrets/db_rws_load
  db_rws_api:
    file: /etc/rws/secrets/db_rws_api

volumes:
  caddy_data:
  caddy_config:
  pgdata:
