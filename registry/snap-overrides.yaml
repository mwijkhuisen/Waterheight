# Reviewed station placements on the river graph (P6b, ADR-0012; schema SnapOverridesFile in
# packages/contracts/src/rivernet.ts). Owner-reviewed (CODEOWNERS); no workflow writes it. Read by tools/geo/rivernet and
# scripts/gen-rivernet.ts, never by readRegistry. Every entry states its evidence in `reason`: a catalogue section and row,
# the registry row, or a measurement on the committed fixture (tools/geo/fixtures, OSM 2026-10-01); [U] marks a fact the
# repository does not settle. Owner-audience rows appear only as the station registry identifies them (id and river).
#   stations  one entry per station that the name rule cannot place or places wrongly: `river` (nearest edge of that river
#             within `max_m`, default 500 m), `canal` (a canal point, never on a river) or `unsnapped: true`. `km_official`
#             is given only where the catalogue ties an RWS river-km to that exact RWS code (Rijn-km and Maas-km (RWS)).
#             All 72 NL-1 stations are here (RWS publishes no water body); so are the 42 LU-1 and 39 LU-2 gauges (AGE
#             publishes none), the FR-1 stations without a water name and the DE-1 and FR-1 cases named in their reasons.
#   waters    water-body labels of OWNER sources that denote a curated river (BE-3). They stay out of rivers.yaml `names`
#             (public sources only, synced into the database) and reach no output. An SPW label is mapped only where every
#             station that carries it lies within 500 m of that river on the fixture; the headwater labels of the Ourthe
#             (Occidentale, Orientale) and the Dendre (Occidentale, Orientale) are left out because some of their stations
#             are kilometres from the curated river.
