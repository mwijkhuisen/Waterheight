excluded:
  - name: "Bovenrijn"
    wikidata: Q55022283
    reason: "No OSM relation or tagged way of its own in the extract (geo.yml run 37061144664): the Bovenrijn (Lobith to the Pannerdensche Kop) is the main stream of the Rhine relation 123924, so the river id rhine covers it"
  - name: "Voer"
    wikidata: Q540657
    reason: "No relation or way carries wikidata=Q540657 in the extract (geo.yml run 37061144664). Nominatim (2026-10-02, q Voer, layer natural, bounded to 5.68-5.92 E, 50.70-50.80 N around Voeren and Eijsden) finds five waterway=stream ways named Voer in Voeren (307446181, 867058350, 41420346, 549778722, 1298076436), none with a wikidata tag, and no relation; unbounded (countrycodes be,nl) it finds the Voer at Leuven (Q3562063, a Dijle tributary). The rules refuse a name-only selection. D21 river, resolve by hand for P13"
joins:
  - river: scheldt
    at: [3.2870075, 50.2241826]
    to_river: scheldt
    max_m: 600
    reason: "KG-161: the Scheldt has a gap between the sink n958071562 of its upper component (3.2870, 50.2242) and the source n2092817137 of the lower one (3.2939, 50.2263), 541 m apart (measured on the fixture 2026-10-01; the next node upstream of the sink, n2092816941, is 63 m back, no other Scheldt node lies within 1.5 km). The FR-1 Escaut gauges (Iwuy E131000202, Maulde E240041101) lie upstream of it, so their path to the Scheldt border needs it"
  - river: ourthe
    at: [5.5796611, 50.6230914]
    to_river: meuse
    max_m: 150
    reason: "KG-161, KG-265 (#110 item 3): the Ourthe relation 2246211 ends at its sink n1637515679 (5.5797, 50.6231) at Liège without sharing a node with the Meuse: the Meuse there is one way, w524363778 (16.0 km, n720478241 to n334511303), whose ends lie 4.2 and 8.5 km away. Its vertex nearest the sink, 97 m off, becomes a node and the join lands there (measured on the fixture 2026-10-01). The Ourthe SPW gauges (owner) need it for their path to Eijsden"
