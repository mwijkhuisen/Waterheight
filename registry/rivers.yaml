# Rivers of the graph (P6a, ADR-0012; A§6 `river`): one row per river that feeds the Netherlands, its
# reviewed NL/EN names and how the OSM data is selected. Owner-reviewed (CODEOWNERS); no workflow writes it.
# Validated by packages/contracts (validateRivers) and test/rivers-registry.test.ts; read by tools/geo/rivernet.
#   names            provider water-body spellings, verbatim, per public catalogue source (the station registry's
#                    water_name); a test checks each one occurs there
#   aliases          other spellings (OSM name:* and local forms), for P6b matching; never shown
#   osm_relation_id  the curated type=waterway relation; the geo run fails if it carries another wikidata tag
#   osm_way_name     only without a relation: ways tagged waterway=*, wikidata=<wikidata> and name=<this>
#   parent_river_id  the river it flows into, or for a delta branch the one it splits from
#   km_direction     how the official km count (downstream, upstream = from the mouth, none known)
#   evidence         where the relation and Wikidata ids come from (never guessed)
#   nl_entry        (P6b, five rivers only) where the river enters the Netherlands: id, NL/EN name, `at` [lon, lat] and
#                   `max_m`; the entry node is the node of the river's own edges nearest `at` within `max_m`, and
#                   km_to_nl_entry is measured to it. A tributary that joins inside NL has none (Rur, Niers, Berkel).
#                   Border points the repository does not give are marked [U] in the evidence
#   flags           (P6b) stretches of a river that are tidal or impounded (catalogue §4.7 items 6-7): kind, optional
#                   `from` / `to` [lon, lat] on the river (absent = the river's start / end), evidence. [U] marks a bound
#                   the repository does not settle
#   joins           (P6b, top level) a reviewed routing-only connection where an OSM relation ends short (KG-161): never
#                   drawn, never published as geometry
#   travel_times    (P6b, top level; #110) sourced values only (catalogue §3.7), between two registered public stations:
#                   `h` hours or `d` days, a range [lo, hi] or one value with its `label` {nl, en} (the condition or
#                   event); `derived: true` for a figure the catalogue derives from other anchors. Indicative, never an
#                   ETA; the catalogue's UNVERIFIED figures and our own medians and low-water legs stay out
#   kind             (P17a) river, delta_channel or canal; a row without it is a river. Canal edges have direction
#                    `none` and stay out of place() and every product (reaches, tiles, download, web labels) until
#                    P17b; they appear in the raw graph assets (river_graph.json, reaches.geojson, qa-report.json)
#   tidal_zone       (P17a, `true` only, delta_channel only) the declared tidal zone: its edges have direction `none`, so
#                    loops are allowed there; its reaches are tidal and carry no travel time
#   mouths           (P17a, top level) where a river ends in the sea or a lake: id, river, `at` [lon, lat], `max_m`
#                    (at most 2000), `waterbody` (one of PENDING_WATERBODY_IDS until P17b's water-body file) and evidence;
#                    the mouth node is the node of the river's own edges nearest `at` within `max_m`, else the build
#                    fails (mouth_unplaced)
