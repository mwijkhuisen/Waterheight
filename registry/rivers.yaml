    source: "RWS note GWIO 85.006 \"Looptijden hoogwatergolven op de Rijn\" (L.P.M. de Vrees, Aug 1985), appendix 1: Emmerich ¼ to 8½ h and once −¼ h, outward to whole hours with a floor of 1 h; catalogue §3.7"
