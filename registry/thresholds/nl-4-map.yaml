# NL-4 -> NL-1 map (P7a, reviewed). The NL-4 workbook `Code` is the NL-1 `Locatie.Code`: both are RWS DDL codes, so a
# class row belongs to the registered primary NL-1 series of the same code and quantity (H: a NAP level series, in cm
# NAP; Q: m3/s), exactly as the registry sync matches them. `none` lists the registered public primary NL-1 series
# that have no class row in the edition, with the reason; test/registry-nl4-map.test.ts proves the list is exactly
# that set, so a new series or a new edition without an entry here fails CI.
