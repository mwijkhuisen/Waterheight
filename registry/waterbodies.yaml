# Water bodies (P17b, ADR-0012, ADR-0022; A§6): the lakes, closed and open estuaries and seas that stations lie in and
# rivers end in. Owner-reviewed (CODEOWNERS); no workflow writes it. Validated by packages/contracts (validateWaterbodies)
# and test/waterbodies-registry.test.ts; read by tools/geo/rivernet (the polygons of the geo build) and the registry sync.
#   id                slug; the rivers.yaml `mouths[].waterbody` ids (eems-dollard, ketelmeer, noordzee, westerschelde,
#                     zwarte-meer) are bodies of this file
#   kind              lake, closed_estuary, estuary or sea
#   name_nl, name_en  reviewed display names (Wikidata labels where they fit)
#   wikidata          the Q-id of the water itself, checked by its labels, its instance (P31) and its coordinate (P625) in
#                     the Netherlands (namesakes exist: Wikidata also has a street item per lake name)
#   osm               {type, id} of the OSM polygon (Wikidata P402) or null for a point-only body (then `point` and `bbox`
#                     are required); a body marked `# probe` waits for the geo.yml name probe to give its OSM id
#   point, bbox       point-only bodies: the label point (Wikidata P625; source in `evidence`) and a reviewed sanity bound
#                     [west, south, east, north], derived from the point and the NL-1 stations of that water type in
#                     registry/stations/nl-1.yaml plus a margin; used only to reject an implausible curated station,
#                     never drawn
#   names             {SOURCE-ID: [verbatim water_name spellings]} as published, like rivers.yaml `names`; each occurs in
#                     registry/stations/nl-1.yaml (a test checks it). Geometry alone never assigns a station to a body
#                     (owner decision R-2): the rest is a curated `waterbody:` override in registry/snap-overrides.yaml
#   managed_level     true: the level is regulated by structures; false: tidal water
#   outflows          [{to, via}] only between bodies of this file and only with a source in `evidence`
#   reference_station the D27 reference gauge (P18b, owner decision O-3 of 2026-10-22): a public primary NL-1 station
#                     placed in this body, whose H series alone gives the lake its state (the spread between the
#                     body's gauges is information, never a state); null for a lake without a placed gauge
#                     (veluwemeer, wolderwijd, vossemeer, zoommeer) and for the seas and estuaries (coloured per
#                     station, D26). drontermeer's gauge has no NL-4 rows, so that lake shows no class.
#   evidence          https URLs: the Wikidata item, the OSM relation when `osm` is set, the outflow source
version: 1
waterbodies:
