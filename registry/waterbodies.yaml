    kind: lake
    name_nl: "IJsselmeer"
    name_en: "IJsselmeer"
    wikidata: Q4121
    osm: {type: relation, id: 945096}
    names:
      NL-1: ["IJsselmeer"]
    managed_level: true
    outflows:
      - {to: waddenzee, via: "discharge sluices in the Afsluitdijk (Rijkswaterstaat)"}
    reference_station: nl.rws.krabbersgat.ijsselmeer
    evidence:
      - https://www.wikidata.org/wiki/Q4121
      - https://www.openstreetmap.org/relation/945096
