# DE-1 PEGELONLINE characteristic values (reference kinds): our reviewed NL and EN text. C22: NW and HW are the lowest
# daily and highest instantaneous water level of the statistical period (Kaub NW 25, HW 719), never NNW or HHW, which
# are the extremes on record. The provider's own longname and dates are stored beside it as the row's basis label.
