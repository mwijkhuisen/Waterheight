  - { scale: danger, code: '3', nl: "Gevarenniveau 3: aanzienlijk gevaar", en: "Danger level 3: considerable danger" }
  - { scale: danger, code: '4', nl: "Gevarenniveau 4: groot gevaar", en: "Danger level 4: high danger" }
