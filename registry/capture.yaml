  # ------------------------------------------------------------------ CH: BAFU (LINDAS, hydrodaten)
  - id: ch-1-lindas
    source: CH-1
    version: 1
    first: true
    cron: "4-59/10 * * * *"
    request:
      method: POST
      url: https://ld.admin.ch/query
      headers: { accept: text/csv, content-type: application/x-www-form-urlencoded }
      body_encoding: form-query
      body: >-
        PREFIX h: <https://environment.ld.admin.ch/foen/hydro/dimension/>
        PREFIX schema: <http://schema.org/>
        PREFIX geo: <http://www.opengis.net/ont/geosparql#>
        PREFIX cube: <https://cube.link/>
        SELECT ?id ?name ?water ?time ?q ?w ?t ?dl ?wkt WHERE {
        <https://environment.ld.admin.ch/foen/hydro/{cube}> cube:observationSet ?set .
        ?set cube:observation ?obs .
        ?obs h:station ?st ; h:measurementTime ?time .
        ?st schema:identifier ?id ; schema:name ?name .
        OPTIONAL { ?st schema:containedInPlace ?water }
        OPTIONAL { ?st geo:hasGeometry/geo:asWKT ?wkt }
        OPTIONAL { ?obs h:discharge ?q } OPTIONAL { ?obs h:waterLevel ?w }
        OPTIONAL { ?obs h:waterTemperature ?t } OPTIONAL { ?obs h:dangerLevel ?dl }
        }
    variants: { values: [{ cube: river }, { cube: lake }] }
    max_bytes: 4194304
    retention: forever
    validity: { format: csv, csv: { delimiter: ',', encoding: utf-8 }, required: [id, name, time, dl], min: 20 }
  - id: ch-2-pq
    source: CH-2
    version: 1
    first: true
    cron: "6-59/10 * * * *"
    request:
      url: https://www.hydrodaten.admin.ch/web-hydro-maps/hydro_sensor_pq.geojson
    conditional: last-modified
    max_bytes: 4194304
    retention: forever
    validity: { format: json, required: [features], count: features, min: 150 }
  - id: ch-3-40d
    source: CH-3
    version: 1
    cron: null
    request:
      url: https://www.hydrodaten.admin.ch/plots/p_q_40days/{id}_p_q_40days_de.json
    variants: { seed: ch-3, key: [id] }
    max_bytes: 8388608
    retention: obs
    validity: { format: json, required: [plot.data], count: plot.data, min: 1 }
    seed: { kind: once, pace_ms: 2000 }
  - id: ch-4-forecast
    source: CH-4
    version: 1
    first: true
    cron: "35 * * * *"
    request:
      url: https://www.hydrodaten.admin.ch/plots/q_forecast/{id}_q_forecast_de.json
    variants: { seed: ch-4, key: [id], space_ms: 500 }
    conditional: last-modified
    gate: { kind: lastmod-runstart }
    max_bytes: 2097152
    retention: forever
    validity: { format: json, required: [plot.data], count: plot.data, min: 1 }
