      type: go-module
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  # stdlib go1.26.8 (go-module) in web: caddy 2.11.7 (caddy:2.11.7-alpine)
  - vulnerability: GO-2026-6603
    package:
      name: stdlib
