# Grype ignore list (P12a, owner decision 2026-10-10; docs/risk-register.md R-095).
#
# Exactly the fixable High and Critical findings of the first P12a scan (release.yml build-pr, run 38080740961),
# all inside third-party binaries we install as released: caddy 2.11.4 (web image; newer images are under the
# 7-day release-age rule until 2026-10-13), restic 0.19.1 (backup), dbmate 2.36.0 and go-pmtiles 1.31.2 (server),
# which have no newer upstream release. Every rule names the vulnerability, the package, its version and type, so a
# new finding, or the same one in another version, still fails the gate.
#
# expires: 2026-11-10
# test/grype-ignore.test.ts fails from that date: bump the binaries (or ask the owner again), then delete the rules
# that no longer match. Never add a rule without an owner decision (CLAUDE.md, dependency policy).
