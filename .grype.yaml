# Grype ignore list (P12a, owner decision 2026-10-10; docs/risk-register.md R-095).
#
# Each rule is an owner decision: it names the vulnerability and the package's name, version and type, so a new
# finding, or the same one in another version, still fails the gate. A rule with a location matches that path only.
# What is accepted today:
# - cloudflared 2026.10.6 (the tunnel edge): GO-2026-6860 in its golang.org/x/net v0.61.0, which every cloudflared
#   release up to 2026.10.7 requires, until a release requiring v0.62.0 or newer is 7 days old (owner 2026-11-06,
#   #252); scoped to the cloudflared binary, so our own images still fail on it.
# - postgres 18.6-trixie: the stdlib go1.24.6 findings of its gosu 1.19, which never runs, since db and the restore
#   drill start as 999:999 (owner 2026-10-16, #167).
# History: #131 built restic, dbmate and go-pmtiles from their release modules with GO_FIXES; #252 did the same for
# Caddy and moved cloudflared to 2026.10.6, which retired every other rule. R-095 keeps the full record.
#
# expires: 2026-11-27
# test/grype-ignore.test.ts fails from that date: bump the binaries (or ask the owner again), then delete the rules
# that no longer match. Never add a rule without an owner decision (CLAUDE.md, dependency policy).
ignore:
  # golang.org/x/net v0.61.0 (go-module) in cloudflared: every release up to 2026.10.7 (owner, 2026-11-06, #252, R-095),
  # until a cloudflared release requiring x/net v0.62.0 or newer is 7 days old. The location is the binary's path in
  # the image as Syft records it.
  - vulnerability: GO-2026-6860
    package:
      name: golang.org/x/net
      version: v0.61.0
      type: go-module
      location: /usr/local/bin/cloudflared
  # stdlib go1.24.6 (go-module) in postgres: gosu 1.19 (postgres:18.6-trixie), never run: db starts as 999 (#167)
  - vulnerability: GO-2025-4006
    package:
      name: stdlib
      version: go1.24.6
      type: go-module
