# Grype ignore list (P12a, owner decision 2026-10-10; docs/risk-register.md R-095).
#
# The first P12a scan (release.yml build-pr, run 38080740961) found fixable High and Critical findings inside the
# third-party binaries we installed as released. #131 cleared them: Caddy 2.11.7 (#158) for the web image, and restic,
# dbmate and go-pmtiles built from their release modules with go1.27.2 and the fixed modules (backup and server images,
# GO_FIXES in their Dockerfiles). What is left is Caddy 2.11.7's Go stdlib go1.26.8 and golang.org/x/net v0.59.0 (owner,
# 2026-10-15; GO-2026-6617, which Grype's database added later, owner 2026-10-16), fixed only in go1.26.9 and x/net
# v0.60.0, which no Caddy release has yet. Alpine's zlib is pinned to its fixed revision in the web Dockerfile (owner,
# 2026-10-16). The owner's plan for the rest (2026-10-16): bump to
# Caddy 2.11.8 once its image is 7 days old; if none is by 2026-11-02, build Caddy from source like the three above.
# #167 (owner, 2026-10-16) scans the third-party images of the compose files too (scripts/third-party-images.sh).
# postgres moved to the 2026-10-07 rebuild of 18.6-trixie (OpenSSL and pcre2 fixed); its gosu 1.19 (go1.24.6, the
# latest gosu) is accepted, since db and the restore drill start as 999:999 and never run it. cloudflared 2026.10.1
# (#169: go1.27.2, x/net v0.61.0, x/crypto v0.58.0) cleared the x/net, x/crypto and stdlib go1.26.8 findings of
# 2026.9.3, and their 7 rules are gone; the libssl3t64 of its distroless base stays, accepted, since cloudflared is a
# static Go binary that never loads it. GHSA-259r-337f-4rfw (klauspost/compress up to v1.18.6, published 2026-10-20):
# restic, dbmate and go-pmtiles take v1.18.7 through GO_FIXES; cloudflared's v1.18.0 (every release up to 2026.10.3)
# is accepted (owner, 2026-10-21, #192).
# Every rule names the vulnerability, the package, its version and type, so a new finding, or the same one in another
# version, still fails the gate.
#
# expires: 2026-11-10
# test/grype-ignore.test.ts fails from that date: bump the binaries (or ask the owner again), then delete the rules
# that no longer match. Never add a rule without an owner decision (CLAUDE.md, dependency policy).
ignore:
  # golang.org/x/net v0.59.0 (go-module) in web: caddy 2.11.7 (caddy:2.11.7-alpine)
  - vulnerability: GO-2026-6603
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
